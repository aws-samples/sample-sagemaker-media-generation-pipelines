# DynamoDB Results Table — Column Name Registry
#
# Maps constant names to DynamoDB attribute names.
# Steps import COL and use COL.PROMPT, COL.MODEL, etc. as dict keys.
# To rename a column, change the value here — all steps pick it up.
#
# Usage:
#   from common.schema import COL
#   record = {COL.ID: "tokyo-rain-alley", COL.STEP: "t2v#wan22#g0", ...}

# ─── Keys ─────────────────────────────────────────────────────────────────────
ID: id
STEP: step

# ─── Identity & tracking ──────────────────────────────────────────────────────
PIPELINE_EXECUTION_ID: pipeline_execution_id
TIMESTAMP: timestamp

# ─── Prompt / text ────────────────────────────────────────────────────────────
PROMPT: prompt
VIDEO_PROMPT: video_prompt
RETRIEVAL_QUERY: retrieval_query
LYRICS: lyrics
TAGS: tags

# ─── Generation metadata ──────────────────────────────────────────────────────
MODEL: model
MODE: mode
GENERATION_INDEX: generation_index
SEED: seed
BPM: bpm
KEYSCALE: keyscale
LLM_MODEL_ID: llm_model_id

# ─── Output asset ─────────────────────────────────────────────────────────────
FILENAME: filename
S3_URI: s3_uri
SIZE_BYTES: size_bytes
EXTENSION: extension

# ─── Source / input reference ─────────────────────────────────────────────────
SOURCE_FILENAME: source_filename
SOURCE_S3_URI: source_s3_uri

# ─── Media properties ─────────────────────────────────────────────────────────
DURATION: duration
FPS: fps
FRAME_COUNT: frame_count
WIDTH: width
HEIGHT: height

# ─── Retrieval ────────────────────────────────────────────────────────────────
OPENSEARCH_SCORE: opensearch_score

# ─── Evaluation (VBench) ──────────────────────────────────────────────────────
UPSTREAM_STEP: upstream_step
VIDEO_COUNT: video_count
SUBJECT_CONSISTENCY: subject_consistency
BACKGROUND_CONSISTENCY: background_consistency
MOTION_SMOOTHNESS: motion_smoothness
DYNAMIC_DEGREE: dynamic_degree
AESTHETIC_QUALITY: aesthetic_quality
IMAGING_QUALITY: imaging_quality
TEMPORAL_FLICKERING: temporal_flickering
TEMPORAL_STYLE: temporal_style
OVERALL_CONSISTENCY: overall_consistency
HUMAN_ACTION: human_action

# ─── Review (A2I) ─────────────────────────────────────────────────────────────
REVIEW_STATUS: review_status
REVIEW_SUBMITTED_AT: review_submitted_at
REVIEW_COMPLETED_AT: review_completed_at
REVIEW_LOOP_NAME: review_loop_name
REVIEW_FLOW_ARN: review_flow_arn
SELECTED: selected
SELECTED_FLAG: selected_flag
