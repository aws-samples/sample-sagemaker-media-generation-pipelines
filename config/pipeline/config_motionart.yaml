dynamodb:
  partition_key: id
  sort_key: step

steps:

  captioning:
    InstanceCount: 1
    InstanceType: ml.g5.xlarge
    VolumeSizeInGB: 100
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--caption"]
    models_prefix: ["qwen2_5_vl_7b"]
    Environment:
      CAPTION_MODEL_NAME: "qwen2_5_vl_7b"

  flf2v:
    InstanceCount: 1
    InstanceType: ml.g5.xlarge
    VolumeSizeInGB: 125
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--generate"]
    models_prefix: ["wan_22_i2v"]
    num_assets_per_prompt: 2

  vbench_flf2v:
    InstanceCount: 1
    InstanceType: ml.g5.xlarge
    VolumeSizeInGB: 125
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--script", "evaluate.py", "--videos-path", "/opt/ml/processing/input/videos", "--output-path", "/opt/ml/processing/output", "--models-path", "/opt/ml/processing/input/models"]
    models_prefix: ["vbench"]
    ecr_image: "vbench"
    input_channel: "videos"

a2i:
  motion_art:
    media_type: video
    task_title: "Review generated video (flf2v)"
    task_description: "Which is the best version of the video?"
    task_count: 1
    task_timeout_seconds: 3600

lambda_steps:
  submit_a2i_flf2v:
    lambda_path: submit_a2i_review
    a2i_name: motion_art
    media_type: video

pipeline_graph:
  captioning: []
  flf2v: ["captioning"]
  vbench_flf2v: ["flf2v"]
  submit_a2i_flf2v: ["flf2v"]
