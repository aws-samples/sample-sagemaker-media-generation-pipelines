    path: "vbench/dino_model/dino_vitbase16_pretrain.pth"

dynamodb:
  partition_key: id
  sort_key: step

steps:
  vrag_llm:
    InstanceCount: 1
    InstanceType: ml.m5.xlarge
    VolumeSizeInGB: 50
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--refine"]
    models_prefix: []
    Environment:
      VRAG_LLM_WORKERS: "10"
      VRAG_LLM_MODEL_ID: "qwen.qwen3-32b-v1:0"

  agent:
    InstanceCount: 1
    InstanceType: ml.m5.xlarge
    VolumeSizeInGB: 50
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--passthrough"]
    models_prefix: []

  retrieval:
    InstanceCount: 1
    InstanceType: ml.c5.xlarge
    VolumeSizeInGB: 50
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--retrieve"]
    models_prefix: []

  i2v:
    InstanceCount: 40
    InstanceType: ml.g5.xlarge
    VolumeSizeInGB: 125
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--model", "wan"]
    models_prefix: ["wan_22_i2v"]
    num_assets_per_prompt: 1

  vbench_i2v:
    InstanceCount: 20
    InstanceType: ml.g5.xlarge
    VolumeSizeInGB: 125
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--script", "evaluate.py", "--videos-path", "/opt/ml/processing/input/videos", "--output-path", "/opt/ml/processing/output", "--models-path", "/opt/ml/processing/input/models"]
    models_prefix: ["vbench"]
    ecr_image: "vbench"
    input_channel: "videos"

# A2I human review configurations
a2i:
  vid_i2v:
    media_type: video
    task_title: "Review generated video (i2v)"
    task_description: "Is this video good?"
    task_count: 1
    task_timeout_seconds: 3600

# Lambda steps invoked as SageMaker Pipeline steps
lambda_steps:
  submit_a2i_i2v:
    lambda_path: submit_a2i_review
    a2i_name: vid_i2v
    media_type: video

# Pipeline DAG: step -> list of dependencies
pipeline_graph:
  vrag_llm: []
  retrieval: ["vrag_llm"]
  i2v: ["retrieval"]
  vbench_i2v: ["i2v"]
  submit_a2i_i2v: ["i2v"]

setup:
  dataset_ingest:
    InstanceCount: 1
    InstanceType: ml.m5.4xlarge
    VolumeSizeInGB: 125
    ContainerEntrypoint: ["python3", "main.py"]
    ContainerArguments: ["--run"]
    models_prefix: []
    dataset_url: "1aurent/unsplash-lite"
    dataset_script: "unsplash.py"
    num_prompts: 1000
    test_image_count: 25000
    Environment:
      MIN_WIDTH: "200"
      MAX_WIDTH: "1280"
      MIN_HEIGHT: "200"
      MAX_HEIGHT: "720"
